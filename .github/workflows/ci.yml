name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM kernel
        run: npm run engine:wasm

      - name: Install Storybook browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Worker type check
        run: npm run type-check:worker

      - name: Unit tests
        run: npm test

      - name: Storybook tests
        run: npm run test-storybook

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build WASM kernel
        run: npm run engine:wasm

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --workspace --release

  rust-features:
    name: Rust feature matrix
    runs-on: ubuntu-latest
    # Workspace-wide clippy unifies features, which hides a broken feature gate.
    # Check photon-engine's feature combinations on their own.
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "sqlite"
          - "mysql"
          - "sqlite,mysql"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: |
          cargo clippy -p photon-engine --all-targets \
            --no-default-features --features "memory,${{ matrix.features }}" -- -D warnings

      - name: Test
        run: |
          cargo test -p photon-engine \
            --no-default-features --features "memory,${{ matrix.features }}"

  wasm:
    name: Photon Engine WASM
    runs-on: ubuntu-latest
    # Nothing else in CI proves the kernel still compiles for wasm32, and the
    # browser client cannot run without it.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM kernel
        run: |
          wasm-pack build crates/photon-engine --target web --out-dir pkg \
            --no-default-features --features wasm

      - name: Check no default features
        run: cargo check -p photon-engine --no-default-features
