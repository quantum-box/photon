name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM kernel
        run: npm run engine:wasm

      - name: Install Storybook browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Worker type check
        run: npm run type-check:worker

      - name: Unit tests
        run: npm test

      - name: Storybook tests
        run: npm run test-storybook

      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: npm ci

      - name: Build WASM kernel
        run: npm run engine:wasm

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Build
        run: cargo build --workspace --release

  rust-features:
    name: Rust feature matrix
    runs-on: ubuntu-latest
    # Workspace-wide clippy unifies features, which hides a broken feature gate.
    # Check photon-engine's feature combinations on their own.
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "sqlite"
          - "mysql"
          - "sqlite,mysql"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: |
          cargo clippy -p photon-engine --all-targets \
            --no-default-features --features "memory,${{ matrix.features }}" -- -D warnings

      - name: Test
        run: |
          cargo test -p photon-engine \
            --no-default-features --features "memory,${{ matrix.features }}"

  rust-mysql:
    name: MySQL storage contract
    runs-on: ubuntu-latest
    # The production storage path. Without a real MySQL in CI the adapter's
    # contract test silently skips and mysql.rs ships unexecuted.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: photon-ci
          MYSQL_DATABASE: photon_engine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pphoton-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: MySQL storage contract tests
        env:
          PHOTON_ENGINE_MYSQL_TEST_DATABASE_URL: mysql://root:photon-ci@127.0.0.1:3306/photon_engine_test
        run: |
          cargo test -p photon-engine --no-default-features \
            --features memory,mysql --test storage_contract

  wasm:
    name: Photon Engine WASM
    runs-on: ubuntu-latest
    # Nothing else in CI proves the kernel still compiles for wasm32, and the
    # browser client cannot run without it.
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM kernel
        run: |
          wasm-pack build crates/photon-engine --target web --out-dir pkg \
            --no-default-features --features wasm

      - name: Check no default features
        run: cargo check -p photon-engine --no-default-features

  pack-smoke:
    name: Package contract
    runs-on: ubuntu-latest
    # `prepare` + workspaces + subpath exports interact in ways that are easy to
    # get wrong and invisible until a consumer installs. Install the real
    # tarball into a scratch app and import every entry point.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install dependencies
        run: npm ci

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Import every subpath from the tarball
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p app && cd app
          cat > package.json <<'JSON'
          { "name": "pack-smoke", "private": true, "type": "module", "version": "1.0.0" }
          JSON
          cat > smoke.ts <<'TS'
          import { createPhotonClient, createEngineTransport, newId, buildWorkspaceScope } from '@quantum-box/photon'
          import { createRestTransport } from '@quantum-box/photon/rest'
          import { useLiveQuery, useMutation, PhotonProvider } from '@quantum-box/photon/react'
          import { createPGliteStore } from '@quantum-box/photon/store-pglite'
          import { loadPhotonKernel } from '@quantum-box/photon/wasm'
          export const surface = {
            createPhotonClient, createEngineTransport, newId, buildWorkspaceScope,
            createRestTransport, useLiveQuery, useMutation, PhotonProvider,
            createPGliteStore, loadPhotonKernel,
          }
          TS
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "target": "ES2022", "lib": ["ES2022", "DOM"], "module": "ESNext",
              "moduleResolution": "bundler", "jsx": "react-jsx",
              "strict": true, "noEmit": true, "skipLibCheck": true
            },
            "include": ["smoke.ts"]
          }
          JSON
          npm install ../quantum-box-photon-*.tgz react @types/react typescript
          npx tsc -p tsconfig.json
