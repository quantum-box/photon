name: Tauri smoke builds

# These two jobs only prove the example desktop/mobile app still compiles.
# They use Linux runners; Android still installs an NDK. They run nightly and on
# pull requests that actually touch the shell.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tauri.yml
      - examples/playground/src-tauri/**
      - crates/photon-engine/**
      - package.json
      - package-lock.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-smoke:
    name: Tauri smoke build
    runs-on: tachyoncloud-4vcpu

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/playground/src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        # Run from the workspace itself: `npm run x -- --flag` through a
        # delegating root script hands --flag to npm, not to the tauri CLI.
        working-directory: examples/playground
        env:
          # linuxdeploy and its AppImage plugin are themselves AppImages, and
          # the self-hosted runner container has no FUSE to mount them with.
          # Extracting instead of mounting is the supported fallback.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build

  tauri-android-smoke:
    name: Tauri Android smoke build
    runs-on: tachyoncloud-4vcpu

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/playground/src-tauri

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: examples/playground
        run: npm run tauri:android:build -- --target aarch64 --apk
