name: Tauri smoke builds

# These three jobs only prove the example desktop/mobile app still compiles.
# They cost an Android NDK install and a macOS runner, so they run nightly and
# on pull requests that actually touch the shell.
on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/tauri.yml
      - examples/playground/src-tauri/**
      - crates/photon-engine/**
      - package.json
      - package-lock.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-smoke:
    name: Tauri smoke build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/playground/src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        # Run from the workspace itself: `npm run x -- --flag` through a
        # delegating root script hands --flag to npm, not to the tauri CLI.
        working-directory: examples/playground
        run: npm run tauri:build

  tauri-android-smoke:
    name: Tauri Android smoke build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/playground/src-tauri

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        working-directory: examples/playground
        run: npm run tauri:android:build -- --target aarch64 --apk

  tauri-ios-smoke:
    name: Tauri iOS simulator smoke build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      # KNOWN BROKEN on CI, cause not yet found. The link step fails with
      #   Undefined symbols: __swift_FORCE_LOAD_$_swiftCompatibility56
      # while the identical project and the identical Xcode build (26.6,
      # 17F113) compile and bundle cleanly on a workstation. Ruled out so far:
      # regenerating gen/apple with `tauri ios init` (only cosmetic diffs), the
      # runner picking an older Xcode (the pin below works — diagnostics show
      # 26.6 selected and libswiftCompatibility56.a present), and a stale rust
      # cache built under a previous Xcode (keying the cache on the toolchain
      # changed nothing). The pin and the diagnostics are kept because they
      # make the next investigation start from facts instead of guesses.
      - name: Show available Xcode versions
        run: ls -d /Applications/Xcode*.app

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Confirm the selected toolchain
        run: |
          xcodebuild -version
          ls -d "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphonesimulator" \
            && ls "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphonesimulator" \
              | grep -i compatibility || echo "no compatibility shims in this toolchain"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      # Cache keyed on the Xcode build so a toolchain change cannot restore
      # object files produced by a different Xcode. (This alone did not fix
      # the failure above, but it is correct hygiene regardless.)
      - name: Record the toolchain in the cache key
        run: xcodebuild -version | tr '\n' '-' > .xcode-version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/playground/src-tauri
          key: ${{ hashFiles('.xcode-version') }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS simulator app
        working-directory: examples/playground
        run: npm run tauri:ios:build:sim
