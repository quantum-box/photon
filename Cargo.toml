[workspace]
resolver = "2"
members = ["crates/*", "examples/rust-sync-server"]
# The playground's Tauri app is deliberately outside this workspace: its mobile
# targets pull a different toolchain and would otherwise share (and thrash) the
# workspace target directory and lockfile.
exclude = ["examples/playground/src-tauri", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Quantum Box"]

[workspace.dependencies]
photon-engine = { path = "crates/photon-engine", default-features = false }
photon-axum = { path = "crates/photon-axum" }

async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "chrono", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
uuid = { version = "1", features = ["v4", "serde"] }
yrs = "0.21"
